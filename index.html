<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Karl Gustav Schröter</title>
  <meta name="description" content="Portfolio von Karl Gustav Schröter — Bilder und Renderings" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"></noscript>
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 40px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; line-height: 1.6; }
    h1 { color: #2c3e50; font-weight: 600; }
    h2 { color: #34495e; font-weight: 600; }
    .tabs { margin-bottom: 30px; display: flex; justify-content: center; }
    .tab-button { padding: 12px 24px; border: 1px solid #bdc3c7; background: #ecf0f1; cursor: pointer; margin-right: 10px; border-radius: 8px; transition: all 0.3s ease; }
    .tab-button.active { background: #3498db; color: white; box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4); }
    .tab-button:hover { background: #95a5a6; color: white; }
    .tab-content { display: none; margin-top: 20px; }
    .tab-content.active { display: block; }
    .gallery { column-count: 4; column-gap: 10px; }
    .gallery-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease; position: relative; cursor: pointer; width: 100%; break-inside: avoid; margin-bottom: 10px; }
    .gallery-item:hover { transform: scale(1.05); }
    .gallery-item img { display: block; width: 100%; height: auto; }
    .gallery-item video { display: block; width: 100%; height: auto; }
    .gallery-item p { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.8); color: white; padding: 10px; margin: 0; opacity: 0; transition: opacity 0.3s ease; }
    .gallery-item:hover p { opacity: 1; }
    footer { margin-top: 50px; text-align: center; color: #7f8c8d; }
    @media (max-width: 768px) {
      body { padding: 20px; }
      .gallery { column-count: 2; }
    }
    @media (max-width: 480px) {
      .gallery { column-count: 1; }
    }
    /* Lightbox Modal Styles */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in;
    }
    .lightbox-content {
      position: relative;
      text-align: center;
    }
    #lightbox-img, #lightbox-video {
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 24px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Gustav Karl Schröter</h1>
  <p>Portfolio mit Bildern und Renderings meiner Projekte.</p>

  <div class="tabs">
    <button class="tab-button active" onclick="showTab(event, 'bilder')">Bilder</button>
    <button class="tab-button" onclick="showTab(event, 'renderings')">Renderings</button>
  </div>

  <div id="bilder" class="tab-content active">
    <h2>Bilder</h2>
    <div class="gallery" id="bilder-gallery"></div>
  </div>

  <div id="renderings" class="tab-content">
    <h2>Renderings</h2>
    <div class="gallery" id="renderings-gallery"></div>
  </div>

<footer>
  <h2>Kontakt</h2>
  <p>E-Mail: gustav.schroeter@directbox.com</p>
</footer>

  <!-- Modal für Bilder und Videos -->
  <div id="lightbox-modal" class="lightbox-modal">
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" style="display: none;">
      <video id="lightbox-video" src="" autoplay muted loop controls playsinline style="display: none; max-width: 90vw; max-height: 90vh;"></video>
    </div>
  </div>

  <script>
    function showTab(event, tabId) {
      event.stopPropagation();
      // Hide all tab contents
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      // Remove active class from all buttons
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(button => button.classList.remove('active'));

      // Show selected tab content
      document.getElementById(tabId).classList.add('active');

      // Add active class to clicked button
      event.target.classList.add('active');
    }

    function sendMessage(e){
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message').value.trim();
      if(!name||!email||!msg){ alert('Bitte alle Felder ausfüllen.'); return }
      const subject = encodeURIComponent('Kontakt über Portfolio von ' + name);
      const body = encodeURIComponent('Name: '+name+'\nE‑Mail: '+email+'\n\n'+msg);
      window.location.href = `mailto:gustav@example.com?subject=${subject}&body=${body}`;
    }

    // Content Management:
    // - Bilder: data/bilder.txt listet einen Dateinamen pro Zeile aus assets/images/bilder/.
    //   Der Dateiname (ohne Endung, ohne "(2)"-Zähler bei Duplikaten) wird zum Text unter dem Bild.
    //   Neues Bild hinzufügen = Datei in assets/images/bilder/ ablegen und den Dateinamen hier eintragen.
    // - Renderings: data/renderings.json, da dort zusätzlich die Software-Angabe gepflegt wird.
    function captionFromFilename(filename) {
      return filename.replace(/\.[^./]+$/, '').replace(/\s*\(\d+\)$/, '');
    }

    function createGalleryItem(entry) {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      if (entry.type === 'video') {
        const video = document.createElement('video');
        video.src = entry.src;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        item.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = entry.src;
        img.alt = entry.alt || '';
        item.appendChild(img);
      }

      const caption = document.createElement('p');
      caption.textContent = entry.software ? `${entry.datum} Software: ${entry.software}` : entry.datum;
      item.appendChild(caption);

      return item;
    }

    async function loadGallery(url, containerId) {
      const container = document.getElementById(containerId);
      const response = await fetch(url);
      const entries = await response.json();
      entries.forEach(entry => container.appendChild(createGalleryItem(entry)));
    }

    async function loadBilderGallery(url, folder, containerId) {
      const container = document.getElementById(containerId);
      const response = await fetch(url);
      const text = await response.text();
      const filenames = text.split('\n').map(line => line.trim()).filter(Boolean);
      filenames.forEach(filename => {
        const caption = captionFromFilename(filename);
        container.appendChild(createGalleryItem({
          type: 'image',
          src: folder + filename,
          alt: caption,
          datum: caption
        }));
      });
    }

    // Lightbox functionality
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        await Promise.all([
          loadBilderGallery('data/bilder.txt', 'assets/images/bilder/', 'bilder-gallery'),
          loadGallery('data/renderings.json', 'renderings-gallery')
        ]);
      } catch (err) {
        console.error('Galerie konnte nicht geladen werden:', err);
      }

      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
      const galleryItems = document.querySelectorAll('.gallery-item');
      const modal = document.getElementById('lightbox-modal');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxVideo = document.getElementById('lightbox-video');

      function openLightbox(item) {
        const img = item.querySelector('img');
        const video = item.querySelector('video');

        if (img) {
          lightboxImg.src = img.src;
          lightboxImg.alt = img.alt;
          lightboxImg.style.display = 'block';
          lightboxVideo.style.display = 'none';
          lightboxVideo.pause();
          lightboxVideo.src = '';
        } else if (video) {
          lightboxVideo.src = video.src;
          lightboxVideo.style.display = 'block';
          lightboxImg.style.display = 'none';
          lightboxImg.src = '';
        }

        modal.style.display = 'flex';
      }

      galleryItems.forEach(item => {
        if (isTouchDevice) {
          let longPressTimer;
          let touchstartX = 0;
          let touchstartY = 0;

          item.addEventListener('touchstart', function(event) {
            touchstartX = event.changedTouches[0].screenX;
            touchstartY = event.changedTouches[0].screenY;
            
            longPressTimer = setTimeout(() => {
              openLightbox(item);
            }, 500); // 500ms for long press
          }, false);

          item.addEventListener('touchmove', function(event) {
            const touchendX = event.changedTouches[0].screenX;
            const touchendY = event.changedTouches[0].screenY;
            const deltaX = Math.abs(touchendX - touchstartX);
            const deltaY = Math.abs(touchendY - touchstartY);

            if (deltaX > 10 || deltaY > 10) { // If moved, cancel the long press
              clearTimeout(longPressTimer);
            }
          }, false);

          item.addEventListener('touchend', function(event) {
            clearTimeout(longPressTimer);
          }, false);
        } else {
          item.addEventListener('click', function() {
            openLightbox(item);
          });
        }

        // Prevent context menu on long press (mobile)
        item.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });
      });

      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
          closeModal();
        }
      });

      function closeModal() {
        modal.style.display = 'none';
        lightboxImg.src = '';
        lightboxImg.style.display = 'none';
        lightboxVideo.pause();
        lightboxVideo.src = '';
        lightboxVideo.style.display = 'none';
      }
    });

    (function(){
      const footer = document.querySelector('footer div');
      if(footer) footer.innerHTML = `© <strong>Gustav Karl Schröter</strong> — ${new Date().getFullYear()}`;
    })();
  </script>
</body>
</html>
